<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan-nextLvl // Portfolio</title>

  <!-- Fira Code -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { mono: ['Fira Code', 'monospace'] },
          colors: {
            'hacker-black':  '#0A0A0A',
            'hacker-card':   '#0F0F0F',
            'hacker-border': '#1F1F1F',
            'hacker-green':  '#C0FFC0',
            'hacker-neon':   '#00FF41',
            'hacker-bin':    '#00CC33',
            'hacker-dim':    '#005515',
          },
          boxShadow: {
            neon: '0 0 8px #00FF41, 0 0 20px #00FF4166',
            'neon-sm': '0 0 4px #00FF41, 0 0 10px #00FF4144',
          },
          keyframes: {
            blink: { '0%,100%': { opacity: '1' }, '50%': { opacity: '0' } },
            pulse_neon: {
              '0%,100%': { boxShadow: '0 0 6px #00FF41, 0 0 14px #00FF4166' },
              '50%':     { boxShadow: '0 0 14px #00FF41, 0 0 30px #00FF41aa' },
            },
            fadeIn: { from: { opacity: '0', transform: 'translateY(16px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
          },
          animation: {
            blink: 'blink 1s step-end infinite',
            pulse_neon: 'pulse_neon 2s ease-in-out infinite',
            fadeIn: 'fadeIn .5s ease both',
          },
        },
      },
    }
  </script>

  <style>
    * { font-family: 'Fira Code', monospace; }
    body { background-color: #0A0A0A; color: #C0FFC0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #00FF41; border-radius: 3px; }
    #binary-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: .08; pointer-events: none; }
    .card-hover { transition: border-color .3s, box-shadow .3s, transform .3s; }
    .card-hover:hover { border-color: #00FF41 !important; box-shadow: 0 0 8px #00FF41, 0 0 20px #00FF4166; transform: translateY(-4px); }
    .timeline-line { background: linear-gradient(to bottom, transparent, #00FF41, transparent); }
  </style>
</head>
<body class="min-h-screen relative">

  <!-- Binary Rain Canvas -->
  <canvas id="binary-canvas"></canvas>

  <div class="relative z-10">

    <!-- ══════════ HEADER ══════════ -->
    <header class="text-center py-16 px-4 border-b border-hacker-border">
      <p class="text-hacker-bin text-sm mb-2 tracking-widest">$ whoami</p>
      <h1 class="text-4xl md:text-6xl font-bold text-hacker-neon drop-shadow-[0_0_12px_#00FF41] mb-4">
        Ryan-nextLvl
      </h1>
      <div class="text-hacker-green text-lg md:text-xl min-h-[2rem]">
        <span id="typing-text"></span><span class="animate-blink text-hacker-neon">█</span>
      </div>
      <div class="mt-6 flex justify-center gap-4 text-hacker-bin text-sm">
        <span>$ status: <span class="text-hacker-neon">online</span></span>
        <span>|</span>
        <span>$ stack: <span class="text-hacker-neon">full-stack dev</span></span>
      </div>
      <!-- Social links -->
      <div class="mt-6 flex justify-center gap-6 text-2xl">
        <a href="https://github.com/Ryan-nextLvl" target="_blank" class="text-hacker-dim hover:text-hacker-neon transition-colors duration-300" title="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="mailto:ryan.aquitwt@gmail.com" class="text-hacker-dim hover:text-hacker-neon transition-colors duration-300" title="E-mail">
          <i class="fas fa-envelope"></i>
        </a>
      </div>
    </header>

    <!-- ══════════ PROJECTS GRID ══════════ -->
    <section class="max-w-6xl mx-auto px-4 py-16" id="projects">
      <h2 class="text-hacker-bin text-sm tracking-widest mb-2">$ ls ./projetos</h2>
      <h3 class="text-2xl font-bold text-hacker-neon mb-10">// Projetos</h3>

      <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- ══════════ TIMELINE ══════════ -->
    <section class="max-w-4xl mx-auto px-4 py-16 border-t border-hacker-border" id="timeline">
      <h2 class="text-hacker-bin text-sm tracking-widest mb-2">$ cat ./experiencias.log</h2>
      <h3 class="text-2xl font-bold text-hacker-neon mb-12">// Linha do Tempo</h3>

      <div class="relative pl-8" id="timeline-list">
        <!-- itens injetados pelo JS -->
      </div>
    </section>

    <!-- ══════════ FOOTER ══════════ -->
    <footer class="border-t border-hacker-border text-center py-10 px-4">
      <!-- CV Download -->
      <a href="./assets/curriculo.pdf" download
         class="inline-flex items-center gap-2 border border-hacker-neon text-hacker-neon px-6 py-3 rounded text-sm hover:bg-hacker-neon hover:text-hacker-black transition-all duration-300 animate-pulse_neon mb-6">
        <i class="fas fa-download"></i> Download CV
      </a>
      <p class="text-hacker-dim text-xs mt-4 tracking-widest">
        &gt;_ session encerrada. $ logout // Ryan-nextLvl &copy; <span id="year"></span>
      </p>
    </footer>

  </div><!-- /z-10 -->

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
